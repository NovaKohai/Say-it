<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Say It - Design Task Mockups</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald-500: #10b981;
      --emerald-600: #059669;
      --emerald-700: #047857;
      --emerald-300: #6ee7b7;
      --cyan-accent: #38bdf8;
      --gold-warning: #f59e0b;
      --red-expense: #ef4444;
      --green-income: #22c55e;
      --light-bg: #f8fafc;
      --light-surface: #ffffff;
      --dark-bg: #0b0f17;
      --dark-surface: #151d28;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
    }
    
    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--light-bg);
      color: var(--text-primary);
      margin: 0;
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    h1, h2, h3 { line-height: 1.25; }
    
    /* Task task-specific classes will be injected per variant */
    .variant-wrapper { min-height: 400px; border: 2px solid transparent; transition: border-color 0.3s ease-out; }
    .variant-wrapper.active { border-color: var(--emerald-500); }
    
    /* Graph area */
    .graph-area { height: 200px; position: relative; background: var(--light-surface); border-radius: 12px; padding: 1rem; margin: 1rem 0; }
    .graph-canvas { height: 100%; position: relative; }
    .bezier-path { fill: none; stroke: var(--emerald-600); stroke-width: 3; stroke-linecap: round; }
    .payoff-point { position: absolute; width: 8px; height: 8px; background: var(--emerald-500); border-radius: 50%; transform: translate(-50%, -50%); }
    .axis-line { stroke: var(--emerald-300); stroke-width: 1; }
    
    /* KPI cards */
    .kpi-card { background: var(--light-surface); padding: 1rem; border-radius: 8px; text-align: center; margin: 0.5rem; min-width: 140px; }
    .kpi-value { font-size: 2rem; font-weight: 700; color: var(--emerald-600); }
    .kpi-label { font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem; }
    
    /* Buttons */
    .btn-primary { background: var(--emerald-600); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 500; border: none; cursor: pointer; }
    .btn-primary:hover { background: var(--emerald-700); }
    .btn-secondary { background: var(--cyan-accent); color: #0f172a; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 500; border: none; cursor: pointer; }
    .btn-secondary:hover { opacity: 0.9; }
    
    /* Confirmation cards */
    .confirmation-card { background: var(--light-surface); border: 1px solid var(--emerald-300); padding: 1rem; border-radius: 8px; margin: 0.5rem 0; }
    .confirmation-card.confirmed { border-color: var(--green-income); }
    .confirmation-card.pending { border-color: var(--emerald-500); }
    
    /* Task-specific overrides */
    .task-bold .variant-wrapper { border-radius: 4px; }
    .task-quieter .variant-wrapper { background: #f1f5f9; }
    .task-animate .payoff-point { animation: pulse 1.5s ease-out infinite; }
    .task-colorize .graph-canvas .bezier-path { stroke: var(--cyan-accent); }
    .task-typeset .kpi-value { font-family: 'Cairo', sans-serif; font-weight: 700; }
    .task-layout .kpi-card { flex: 1; }
    .task-clarify .confirmation-card .btn-primary { font-size: 0.875rem; }
    .task-adapt .variant-wrapper { width: 100%; }
    .task-optimize .graph-canvas { will-change: transform; }
    
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Say It Design Task Mockups</h1>
    <p>12 design task variants applied to the Say It Dashboard</p>
    
    <div class="grid grid-cols-2 gap-3 mb-4" id="task-nav">
      <!-- Navigation buttons will be generated -->
    </div>
    
    <div id="variants" class="space-y-4">
      <!-- Variants will be generated -->
    </div>
    
    <hr>
    <p><small>Based on Say It financial app | Register: product | Brand: reliable | Palette: Emerald primary</small></p>
  </div>

  <script>
    // Task data - each variant's specific modifications
    const taskVariants = {
      shape: {
        name: 'shape',
        title: 'Shape: Plan UX/UI',
        desc: 'Curved Bézier payoff graph with Emerald arcs; smooth progress visuals',
        changes: {
          graph: 'Smooth Bezier curves with gentle peaks/troughs; Emerald stroke #059669',
          kpis: 'Standard layout; Cairo displayLarge for payoff percentage'
        }
      },
      craft: {
        name: 'craft',
        title: 'Craft: Build end-to-end',
        desc: 'Hand-crafted installment cards with precise corner radii; micro-interactions',
        changes: {
          graph: 'Standard graph; installment cards with 16dp corner radius',
          kpis: 'Cards with subtle embossing; Cairo Medium weight for amounts'
        }
      },
      polish: {
        name: 'polish',
        title: 'Polish: Final quality',
        desc: '4dp shadow system consistency; elevation across graph, cards, list',
        changes: {
          graph: 'Consistent 2dp shadow; axis lines #e2e8f0',
          kpis: 'Uniform shadow on all cards; consistent border-radius 8px'
        }
      },
      bolder: {
        name: 'bolder',
        title: 'Bolder: Amplify',
        desc: 'Primary action buttons in bold Emerald with cyan accent stroke',
        changes: {
          graph: 'Enhanced contrast; brighter Emerald 500',
          kpis: 'Primary CTA button: Emerald 600 with cyan stroke outline'
        }
      },
      quieter: {
        name: 'quieter',
        title: 'Quieter: Tone down',
        desc: 'Secondary links in muted cyan; no competition with KPI figures',
        changes: {
          graph: 'Subdued colors; emerald-300 for grid lines',
          kpis: 'Secondary links in cyan-200; reduced visual weight'
        }
      },
      animate: {
        name: 'animate',
        title: 'Animate: Motion',
        desc: 'Payoff graph points animate on new payment; ease-out transition',
        changes: {
          graph: 'Points with ease-out-quint pulse animation; highlight updated balance',
          kpis: 'Subtle fade-in when new transaction recorded'
        }
      },
      colorize: {
        name: 'colorize',
        title: 'Colorize: Strategic color',
        desc: 'Chat bubbles color-coded; confirmation cards in amber',
        changes: {
          graph: 'Cyan accent stroke #38bdf8 instead of Emerald',
          kpis: 'User message bubbles cyan; assistant replies Emerald 500'
        }
      },
      typeset: {
        name: 'typeset',
        title: 'Typeset: Typography',
        desc: 'Cairo throughout; KPI values heavier weight; hierarchy 1.25+ ratio',
        changes: {
          graph: 'Cairo font for all text labels; hierarchy established',
          kpis: 'KPI values: Cairo 700; labels: Cairo 400; 1.5x line height body'
        }
      },
      layout: {
        name: 'layout',
        title: 'Layout: Rhythm',
        desc: '4dp grid; KPI cards 2×3; payoff central; transaction list beneath',
        changes: {
          graph: 'Graph centered in column layout; surrounding cards aligned to grid',
          kpis: 'Cards in exact 2×3 grid; gutters exactly 1.5rem; sidebar list flows below'
        }
      },
      clarify: {
        name: 'clarify',
        title: 'Clarify: UX copy',
        desc: 'Tool tips and inline labels for AI Copilot confirmation cards',
        changes: {
          graph: 'Axis labels with full descriptions; month names spelled out',
          kpis: 'Inline tooltips on hover; confirmation card text: "Confirm payment of X JMD"'
        }
      },
      adapt: {
        name: 'adapt',
        title: 'Adapt: Different screens',
        desc: 'Fluid adaptation phone→tablet; re-flowing graph and cards',
        changes: {
          graph: 'Responsive: 2-column on tablet; single column on phone',
          kpis: 'Grid adjusts: 3 cards phone → 4 cards tablet → 6 cards desktop'
        }
      },
      optimize: {
        name: 'optimize',
        title: 'Optimize: Performance',
        desc: 'Minimize re-draws; cache installment data; responsive graph',
        changes: {
          graph: 'Canvas with will-change; memoized point calculations',
          kpis: 'Card data memoization; reduced re-renders on scroll'
        }
      }
    };
    
    // Render variants
    const container = document.getElementById('variants');
    const taskNav = document.getElementById('task-nav');
    
    let currentTask = 'shape';
    
    function renderVariant(taskName) {
      const task = taskVariants[taskName];
      if (!task) return;
      
      currentTask = taskName;
      
      // Update nav
      const buttons = taskNav.innerHTML;
      const navHtml = Object.keys(taskVariants).map(t => `
        <button class="px-3 py-1 rounded text-sm ${
          t === taskName ? 'bg-emerald-600 text-white' : 'text-emerald-600 hover:bg-emerald-100'
        }" onclick="renderVariant('${t}')">
          ${t}
        </button>
      `).join('');
      taskNav.innerHTML = navHtml;
      
      // Render variant
      const changes = task.changes;
      let graphSvg = '';
      let kpiHtml = '';
      
      // Graph area
      const graphPoints = [
        { x: 100, y: 50 },
        { x: 200, y: 150 },
        { x: 300, y: 80 },
        { x: 400, y: 180 },
        { x: 500, y: 60 },
        { x: 600, y: 160 }
      ];
      
      const pathData = graphPoints.map((p, i) => {
        const prev = graphPoints[i - 1];
        if (!prev) return `M ${p.x} ${p.y}`;
        return `C ${(p.x + prev.x) / 2} ${prev.y}, ${(p.x + prev.x) / 2} ${p.y}, ${p.x} ${p.y}`;
      }).join(' ');
      
      graphSvg = `
        <svg class="graph-area" width="600" height="200" viewBox="0 0 600 200">
          <path class="bezier-path" d="${pathData}"/>
          ${graphPoints.map((p, i) => `<circle class="payoff-point" cx="${p.x}" cy="${p.y}" title="Point ${i+1}"></circle>`).join('')}
          <rect class="axis-line" x="50" y="0" width="550" height="2"/>
        </svg>
      `;
      
      // KPI cards - 4 cards representing: Total Commitment, Remaining, Paid %, Monthly
      const kpiData = [
        { label: 'Total', value: '2,500', variant: taskName },
        { label: 'Remaining', value: '850', variant: taskName },
        { label: 'Paid %', value: '66%', variant: taskName },
        { label: 'Monthly', value: '250', variant: taskName }
      ];
      
      kpiHtml = kpiData.map(k => `
        <div class="kpi-card task-${taskName}">
          <div class="kpi-value" style="color: ${taskName === 'colorize' && k.label === 'User' ? 'var(--cyan-accent)' : 'var(--emerald-600)'}">
            ${k.value}
          </div>
          <div class="kpi-label">${k.label}</div>
        </div>
      `).join('');
      
      const variantHtml = `
        <div class="variant-wrapper" data-task="${taskName}" onclick="renderVariant('${taskName}')">
          <h2 class="font-medium mb-3">${task.title}</h2>
          <p class="text-sm text-secondary capitalize">${task.desc}</p>
          
          <div class="graph-area" style="margin: 1rem 0;">
            ${graphSvg}
          </div>
          
          <div class="grid grid-cols-2 gap-2">
            ${kpiHtml}
          </div>
          
          <div style="margin-top: 1rem;">
            <button class="btn-primary w-full">Add Installment</button>
            <button class="btn-secondary w-full mt-2">View Details</button>
          </div>
        </div>
      `;
      
      container.innerHTML = variantHtml;
      
      // Apply task-specific classes
      const wrapper = container.previousElementSibling;
      wrapper.className = `variant-wrapper ${taskName}`;
    }
    
    // Initialize with shape
    renderVariant('shape');
    
    // Add task nav
    taskNav.innerHTML = Object.keys(taskVariants).map(t => `
      <button class="px-3 py-1 rounded text-sm text-emerald-600 hover:bg-emerald-100" onclick="renderVariant('${t}')">
        ${t}
      </button>
    `).join('');
  </script>
</body>
</html>
